[project]
name = "signalpost-agent"
version = "1.0.0"
description = "Evidence-first Norwegian company research agent for the Builderr Signalpost challenge"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "extruct>=0.18,<1",
  "tldextract>=5.1,<6",
  "trafilatura>=2.0,<3",
]

[project.scripts]
signalpost = "signalpost_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalpost_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
